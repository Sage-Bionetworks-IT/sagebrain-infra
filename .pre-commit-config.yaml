ci:
  autoupdate_schedule: monthly

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/awslabs/cfn-python-lint
    rev: v1.57.1
    hooks:
      - id: cfn-python-lint
        args:
          - "-i=E1001"
        exclude: |
          (?x)(
            ^.venv/|
            ^tests/|
            ^docker/|
            ^temp/|
            ^.github/|
            ^.pre-commit-config.yaml
          )
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.0
    hooks:
      - id: black
  - repo: https://github.com/sirosen/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-github-actions
  # Generated pydantic models must match api/openapi.yaml (constitution, article I).
  # Isolated env: datamodel-code-generator can't share one with aws-cdk-lib (typeguard pins).
  - repo: local
    hooks:
      - id: openapi-models
        name: Pydantic models match api/openapi.yaml
        language: python
        entry: python tools/gen_models.py --check
        files: ^(api/openapi\.yaml|app/sagebrain_api/models/_generated\.py|tools/gen_models\.py)$
        pass_filenames: false
        additional_dependencies:
          - datamodel-code-generator==0.83.0
          - black==26.5.1
          - isort==8.0.1
