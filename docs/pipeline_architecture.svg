<svg width="100%" viewBox="0 0 1060 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; }
      .node { fill: #232219; }
      .flow { fill: none; stroke: #77746a; stroke-width: 1.6; }
      .flow-d { fill: none; stroke: #77746a; stroke-width: 1.4; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1060" height="560" fill="#191813"/>

  <!-- Title -->
  <text x="30" y="36" text-anchor="start" style="fill:#d3d1c7;font-size:19px;font-weight:600">Append-Only Neptune Ingestion Pipeline</text>
  <text x="30" y="58" text-anchor="start" style="fill:#7c796f;font-size:12px;font-weight:400">New stack: app-dev-neptune-pipeline — S3 manifest.ttl upload drives an automated Neptune bulk load</text>

  <!-- ============ Flow connectors (drawn first, under nodes) ============ -->
  <!-- Transform -> S3 -->
  <path class="flow" d="M115 250 V204" marker-end="url(#arrow)"/>
  <text x="123" y="230" text-anchor="start" style="fill:#8a877d;font-size:10.5px">1. put objects</text>
  <!-- S3 -> EventBridge -->
  <path class="flow" d="M200 156 H258" marker-end="url(#arrow)"/>
  <text x="340" y="106" text-anchor="middle" style="fill:#8a877d;font-size:10.5px">2. S3 Object Created</text>
  <!-- EventBridge -> Step Functions -->
  <path class="flow" d="M420 152 H468" marker-end="url(#arrow)"/>
  <text x="470" y="90" text-anchor="start" style="fill:#8a877d;font-size:10.5px">3. StartExecution (input = $.detail)</text>
  <!-- EventBridge -> DLQ -->
  <path class="flow-d" d="M340 184 V250" marker-end="url(#arrow)"/>
  <text x="348" y="220" text-anchor="start" style="fill:#8a877d;font-size:10.5px">on failure</text>
  <!-- DLQ -> CloudWatch -->
  <path class="flow-d" d="M340 306 V340" marker-end="url(#arrow)"/>
  <text x="348" y="326" text-anchor="start" style="fill:#8a877d;font-size:10.5px">depth</text>
  <!-- Step Functions -> CloudWatch -->
  <path class="flow-d" d="M470 360 H422" marker-end="url(#arrow)"/>
  <text x="446" y="352" text-anchor="middle" style="fill:#8a877d;font-size:10px">failed</text>
  <!-- Step Functions -> Lambda -->
  <path class="flow" d="M770 180 H823" marker-end="url(#arrow)"/>
  <text x="785" y="170" text-anchor="start" style="fill:#8a877d;font-size:10.5px">invoke</text>
  <!-- Lambda -> Neptune -->
  <path class="flow" d="M922 216 V268" marker-end="url(#arrow)"/>
  <text x="932" y="246" text-anchor="start" style="fill:#8a877d;font-size:10.5px">:8182 /loader</text>
  <!-- Lambda -> DynamoDB (left gutter) -->
  <path class="flow-d" d="M835 216 H815 V440 H823" marker-end="url(#arrow)"/>
  <text x="830" y="404" text-anchor="start" style="fill:#8a877d;font-size:10.5px">track status</text>
  <!-- S3 -> Neptune : loader reads S3 via load role (bottom route) -->
  <path class="flow-d" d="M195 204 V225 H215 V498 H790 V303 H823" marker-end="url(#arrow)"/>
  <text x="430" y="490" text-anchor="middle" style="fill:#8a877d;font-size:10.5px">4. Neptune bulk loader reads the snapshot from S3 via NeptuneLoadRole</text>

  <!-- ============ Nodes ============ -->
  <!-- S3 -->
  <rect class="node" x="30" y="112" width="170" height="92" rx="8" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="115" y="138" text-anchor="middle" style="fill:#a9dcc9;font-size:13px;font-weight:500">Amazon S3 · Data Bucket</text>
  <text x="115" y="160" text-anchor="middle" style="fill:#8f8c82;font-size:11px">{portal}/YYYY-MM-DD/data/*.ttl</text>
  <text x="115" y="178" text-anchor="middle" style="fill:#8f8c82;font-size:11px">+ manifest.ttl (last, trigger)</text>

  <!-- Transform (upstream) -->
  <rect class="node" x="30" y="250" width="170" height="60" rx="8" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="115" y="276" text-anchor="middle" style="fill:#c2c0b6;font-size:13px;font-weight:500">Upstream Transform</text>
  <text x="115" y="294" text-anchor="middle" style="fill:#8f8c82;font-size:11px">writes snapshot, then manifest</text>

  <!-- EventBridge -->
  <rect class="node" x="260" y="120" width="160" height="64" rx="8" stroke="#534AB7" stroke-width="1.5"/>
  <text x="340" y="146" text-anchor="middle" style="fill:#b9b3ef;font-size:13px;font-weight:500">Amazon EventBridge</text>
  <text x="340" y="166" text-anchor="middle" style="fill:#8f8c82;font-size:11px">rule: key suffix manifest.ttl</text>

  <!-- SQS DLQ -->
  <rect class="node" x="260" y="250" width="160" height="56" rx="8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="340" y="274" text-anchor="middle" style="fill:#c2c0b6;font-size:13px;font-weight:500">Amazon SQS · DLQ</text>
  <text x="340" y="292" text-anchor="middle" style="fill:#8f8c82;font-size:11px">failed rule deliveries</text>

  <!-- CloudWatch -->
  <rect class="node" x="260" y="340" width="160" height="56" rx="8" stroke="#993C1D" stroke-width="1.5"/>
  <text x="340" y="364" text-anchor="middle" style="fill:#e0a58c;font-size:13px;font-weight:500">CloudWatch Alarms</text>
  <text x="340" y="382" text-anchor="middle" style="fill:#8f8c82;font-size:11px">failed exec · DLQ depth</text>

  <!-- Step Functions container -->
  <rect x="470" y="96" width="300" height="386" rx="10" fill="#1d1c16" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="486" y="118" text-anchor="start" style="fill:#a9dcc9;font-size:12.5px;font-weight:600">AWS Step Functions · LoadPipeline</text>

  <!-- StartLoad -->
  <rect class="node" x="540" y="138" width="160" height="38" rx="7" stroke="#8f8c82" stroke-width="1.3"/>
  <text x="620" y="161" text-anchor="middle" style="fill:#d3d1c7;font-size:12px;font-weight:500">StartLoad</text>
  <path class="flow" d="M620 176 V194" marker-end="url(#arrow)"/>

  <!-- Wait -->
  <rect class="node" x="540" y="194" width="160" height="34" rx="7" stroke="#8f8c82" stroke-width="1.3"/>
  <text x="620" y="215" text-anchor="middle" style="fill:#d3d1c7;font-size:12px;font-weight:500">Wait 30s</text>
  <path class="flow" d="M620 228 V246" marker-end="url(#arrow)"/>

  <!-- CheckLoad -->
  <rect class="node" x="540" y="246" width="160" height="38" rx="7" stroke="#8f8c82" stroke-width="1.3"/>
  <text x="620" y="269" text-anchor="middle" style="fill:#d3d1c7;font-size:12px;font-weight:500">CheckLoad</text>
  <path class="flow" d="M620 284 V304" marker-end="url(#arrow)"/>

  <!-- Choice -->
  <rect class="node" x="540" y="304" width="160" height="40" rx="7" stroke="#185FA5" stroke-width="1.4"/>
  <text x="620" y="328" text-anchor="middle" style="fill:#b5d4f4;font-size:12px;font-weight:500">Choice · LoadComplete?</text>

  <!-- loop back to Wait -->
  <path class="flow" d="M540 324 H508 V211 H538" marker-end="url(#arrow)"/>
  <text x="502" y="270" text-anchor="end" style="fill:#8a877d;font-size:10px">in progress</text>

  <!-- Choice -> RecordSuccess / RecordFailure -->
  <path class="flow" d="M598 344 L556 408" marker-end="url(#arrow)"/>
  <text x="548" y="384" text-anchor="middle" style="fill:#8a877d;font-size:10px">COMPLETED</text>
  <path class="flow" d="M642 344 L690 408" marker-end="url(#arrow)"/>
  <text x="700" y="384" text-anchor="middle" style="fill:#8a877d;font-size:10px">failed</text>

  <!-- RecordSuccess -->
  <rect class="node" x="482" y="410" width="132" height="44" rx="7" stroke="#1D9E75" stroke-width="1.4"/>
  <text x="548" y="428" text-anchor="middle" style="fill:#a9dcc9;font-size:12px;font-weight:500">RecordSuccess</text>
  <text x="548" y="444" text-anchor="middle" style="fill:#8f8c82;font-size:10.5px">→ Succeed</text>

  <!-- RecordFailure -->
  <rect class="node" x="628" y="410" width="132" height="44" rx="7" stroke="#BA7517" stroke-width="1.4"/>
  <text x="694" y="428" text-anchor="middle" style="fill:#e6be86;font-size:12px;font-weight:500">RecordFailure</text>
  <text x="694" y="444" text-anchor="middle" style="fill:#8f8c82;font-size:10.5px">→ Fail → Alarm</text>

  <!-- VPC boundary -->
  <rect x="808" y="108" width="228" height="252" rx="10" fill="none" stroke="#185FA5" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="822" y="126" text-anchor="start" style="fill:#7fa8d6;font-size:10.5px">VPC · private subnets</text>

  <!-- Lambda -->
  <rect class="node" x="825" y="148" width="196" height="68" rx="8" stroke="#BA7517" stroke-width="1.5"/>
  <text x="923" y="176" text-anchor="middle" style="fill:#e6be86;font-size:13px;font-weight:500">AWS Lambda · loader.py</text>
  <text x="923" y="196" text-anchor="middle" style="fill:#8f8c82;font-size:11px">start · check · record  (SigV4)</text>

  <!-- Neptune -->
  <rect class="node" x="825" y="268" width="196" height="68" rx="8" stroke="#185FA5" stroke-width="1.5"/>
  <text x="923" y="296" text-anchor="middle" style="fill:#b5d4f4;font-size:13px;font-weight:500">Amazon Neptune (writer)</text>
  <text x="923" y="316" text-anchor="middle" style="fill:#8f8c82;font-size:11px">bulk load → named graph</text>

  <!-- DynamoDB -->
  <rect class="node" x="825" y="410" width="196" height="60" rx="8" stroke="#185FA5" stroke-width="1.5"/>
  <text x="923" y="434" text-anchor="middle" style="fill:#b5d4f4;font-size:13px;font-weight:500">Amazon DynamoDB</text>
  <text x="923" y="452" text-anchor="middle" style="fill:#8f8c82;font-size:11px">load tracking / lineage (no TTL)</text>

  <!-- Footnotes -->
  <text x="30" y="524" text-anchor="start" style="fill:#6f6c64;font-size:10.5px">• StartLoad skips → Succeed when the snapshot's manifest etag already loaded (idempotent).</text>
  <text x="30" y="540" text-anchor="start" style="fill:#6f6c64;font-size:10.5px">• One named graph per snapshot: urn:sagebrain:{portal}:{date} — every historical version stays isolated (append-only).</text>
</svg>
