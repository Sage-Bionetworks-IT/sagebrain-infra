TAGS:
  CostCenter: NO PROGRAM / 000000

# Cost monitoring: service-level anomaly detection + account-level monthly budget.
# Configure per-environment in config/<env>.yaml.
COST_MONITORING:
  # Per-service anomaly detection — alerts when individual services spike unexpectedly.
  # Email includes which service, expected vs actual cost, and impact amount.
  service_anomaly:
    enabled: false
    threshold_usd: 100  # Alert if anomaly impact >= this amount
    frequency: "IMMEDIATE"
    email_subscribers: []
  # Account-wide monthly budget — alerts at percentage thresholds (e.g., 80%, 100%, 120%).
  account_budget:
    enabled: false
    monthly_limit_usd: 1000  # Total monthly spending cap
    alert_thresholds: [80, 100, 120]  # Alert at 80%, 100%, 120% of limit
    email_subscribers: []

NEPTUNE:
  engine_version: "1.3.2.1"
  serverless_min_capacity: 1.0
  serverless_max_capacity: 8.0
  backup_retention_days: 7
  preferred_backup_window: "03:00-04:00"
  preferred_maintenance_window: "sun:04:00-sun:05:00"
  deletion_protection: true
  cloudwatch_logs_exports:
    - "audit"
    - "slowquery"
  iam_auth_enabled: true
  storage_encrypted: true
  auto_minor_version_upgrade: true
  create_parameter_group: false
  parameter_group_parameters: {}

NEPTUNE_SAGEMAKER:
  enabled: true
  domain_name: "sage-brain-studio"

# Append-only ingestion pipeline. Triggers on {portal}/YYYY-MM-DD/manifest.ttl
# uploads and bulk-loads each snapshot into its own named graph.
NEPTUNE_PIPELINE:
  enabled: true
  graph_uri_template: "urn:sagebrain:{portal}:{date}"
  parallelism: "HIGH"
  wait_seconds: 30

# Graph Explorer visualization UI (open-source). Disabled by default; enable
# per-env and list the source IP/CIDRs allowed to reach the ALB.
NEPTUNE_VIZ:
  enabled: false
  allowed_cidrs: []
  # Graph Explorer image. Pin a tag or digest per-env for reproducible deploys,
  # e.g. "public.ecr.aws/neptune/graph-explorer@sha256:<digest>".
  image: "public.ecr.aws/neptune/graph-explorer:latest"

AUTH:
  synapse_team_id: "3605470"
  # machine_api_key: ""  # set in env-specific config (not committed); enables x-api-key auth
